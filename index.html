<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DogAtlas</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f1e9;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 24px 18px;
    }

    h1 {
      text-align: center;
      font-size: 36px;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .card span {
      font-size: 26px;
      margin-right: 10px;
    }

    .footer {
      text-align: center;
      color: #999;
      margin-top: 30px;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>DogAtlas 🐶</h1>
    <div class="subtitle">Твой маленький мир собак</div>

    <div class="card">
      <span>🌟</span>
      Собака дня
    </div>

    <div class="card">
      <span>🔍</span>
      Угадай породу
    </div>

    <div class="card">
      <span>🎲</span>
      Случайная собака
    </div>

    <div class="card">
      <span>📚</span>
      Каталог пород
    </div>

    <div class="card">
      <span>🐾</span>
      Какая ты собака?
    </div>

    <div class="footer">
      DogAtlas © 2026
    </div>

  </div>

</body>
</html>
