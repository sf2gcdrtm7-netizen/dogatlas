<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DogAtlas</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  background: #f6f1e9;
  color: #222;
}

.container {
  max-width: 560px;
  margin: 0 auto;
  padding: 28px 18px 60px;
}

.page {
  display: none;
}

.page.active {
  display: block;
}

h1 {
  text-align: center;
  font-size: 39px;
  margin: 10px 0 5px;
}

h2 {
  margin-top: 4px;
}

.subtitle {
  text-align: center;
  color: #888;
  font-size: 18px;
  margin-bottom: 30px;
}

.menu-card {
  background: white;
  border-radius: 25px;
  padding: 22px;
  margin-bottom: 14px;
  box-shadow: 0 5px 18px rgba(0,0,0,.07);
  font-size: 20px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 15px;
  transition: .15s;
}

.menu-card:active,
.button:active,
.answer:active,
.breed-card:active {
  transform: scale(.97);
}

.emoji {
  font-size: 29px;
}

.back {
  border: 0;
  background: white;
  padding: 12px 17px;
  border-radius: 16px;
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 18px;
  cursor: pointer;
}

.content-card {
  background: white;
  border-radius: 25px;
  padding: 22px;
  box-shadow: 0 5px 18px rgba(0,0,0,.07);
  text-align: center;
}

.dog-img {
  display: block;
  width: 100%;
  max-height: 390px;
  object-fit: cover;
  border-radius: 22px;
  margin: 18px 0;
  background: #eee;
}

.date {
  color: #888;
  margin-bottom: 6px;
}

.breed-title {
  font-size: 25px;
  font-weight: 800;
  margin: 8px 0;
}

.button,
.answer {
  width: 100%;
  border: 0;
  background: white;
  box-shadow: 0 3px 13px rgba(0,0,0,.06);
  border-radius: 18px;
  padding: 16px;
  margin-top: 11px;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
}

.button.dark {
  background: #222;
  color: white;
}

.answer.correct {
  background: #daf5dc;
}

.answer.wrong {
  background: #ffdede;
}

.result-message {
  min-height: 26px;
  font-size: 18px;
  font-weight: 700;
  margin-top: 17px;
}

.catalog {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 11px;
  margin-top: 16px;
}

.breed-card {
  background: white;
  padding: 17px 10px;
  border-radius: 18px;
  text-align: center;
  font-weight: 700;
  box-shadow: 0 3px 12px rgba(0,0,0,.05);
  cursor: pointer;
}

.search {
  width: 100%;
  border: 0;
  outline: none;
  background: white;
  border-radius: 18px;
  padding: 16px;
  font-size: 16px;
  margin: 5px 0 8px;
}

.progress {
  color: #888;
  margin-bottom: 14px;
}

.quiz-question {
  font-size: 22px;
  font-weight: 800;
  margin-bottom: 18px;
}

.loading {
  color: #888;
}

.footer {
  text-align: center;
  color: #aaa;
  margin-top: 35px;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

<!-- ГЛАВНАЯ -->

<div id="home" class="page active">

  <h1>DogAtlas 🐶</h1>
  <div class="subtitle">Твой маленький мир собак</div>

  <div class="menu-card" onclick="showDogOfDay()">
    <span class="emoji">🌟</span>
    Собака дня
  </div>

  <div class="menu-card" onclick="startGuess()">
    <span class="emoji">🔍</span>
    Угадай породу
  </div>

  <div class="menu-card" onclick="showRandomDog()">
    <span class="emoji">🎲</span>
    Случайная собака
  </div>

  <div class="menu-card" onclick="openCatalog()">
    <span class="emoji">📚</span>
    Каталог пород
  </div>

  <div class="menu-card" onclick="startQuiz()">
    <span class="emoji">🐾</span>
    Какая ты собака?
  </div>

  <div class="footer">DogAtlas © 2026</div>

</div>


<!-- СОБАКА ДНЯ -->

<div id="dogday" class="page">

  <button class="back" onclick="goHome()">← Назад</button>

  <div class="content-card">

    <h2>🌟 Собака дня</h2>

    <div id="dayDate" class="date"></div>

    <div id="dayBreed" class="breed-title"></div>

    <img id="dayImage" class="dog-img">

    <p id="dayText"></p>

  </div>

</div>


<!-- УГАДАЙ ПОРОДУ -->

<div id="guess" class="page">

  <button class="back" onclick="goHome()">← Назад</button>

  <div class="content-card">

    <h2>🔍 Угадай породу</h2>

    <div id="guessScore" class="date">
      Угадано: 0
    </div>

    <img id="guessImage" class="dog-img">

    <div id="guessAnswers"></div>

    <div id="guessMessage" class="result-message"></div>

    <button
      id="nextGuess"
      class="button dark"
      onclick="newGuess()"
      style="display:none"
    >
      Следующая собака →
    </button>

  </div>

</div>


<!-- СЛУЧАЙНАЯ СОБАКА -->

<div id="random" class="page">

  <button class="back" onclick="goHome()">← Назад</button>

  <div class="content-card">

    <h2>🎲 Случайная собака</h2>

    <div id="randomBreed" class="breed-title"></div>

    <img id="randomImage" class="dog-img">

    <button class="button dark" onclick="loadRandomDog()">
      Показать другую 🐕
    </button>

  </div>

</div>


<!-- КАТАЛОГ -->

<div id="catalog" class="page">

  <button class="back" onclick="goHome()">← Назад</button>

  <h2>📚 Каталог пород</h2>

  <input
    id="breedSearch"
    class="search"
    placeholder="🔎 Найти породу..."
    oninput="renderCatalog()"
  >

  <div id="catalogList" class="catalog"></div>

</div>


<!-- КАРТОЧКА ПОРОДЫ -->

<div id="breedDetail" class="page">

  <button class="back" onclick="openPage('catalog')">
    ← К каталогу
  </button>

  <div class="content-card">

    <div id="detailBreed" class="breed-title"></div>

    <img id="detailImage" class="dog-img">

    <button
      id="detailAnother"
      class="button"
    >
      Другое фото 📸
    </button>

  </div>

</div>


<!-- ТЕСТ -->

<div id="quiz" class="page">

  <button class="back" onclick="goHome()">← Назад</button>

  <div class="content-card">

    <h2>🐾 Какая ты собака?</h2>

    <div id="quizProgress" class="progress"></div>

    <div id="quizQuestion" class="quiz-question"></div>

    <div id="quizAnswers"></div>

  </div>

</div>


<!-- РЕЗУЛЬТАТ ТЕСТА -->

<div id="quizResultPage" class="page">

  <button class="back" onclick="goHome()">← На главную</button>

  <div class="content-card">

    <h2>Твой результат 🐾</h2>

    <div id="finalBreed" class="breed-title"></div>

    <img id="finalImage" class="dog-img">

    <p id="finalText"></p>

    <button class="button dark" onclick="startQuiz()">
      Пройти тест ещё раз
    </button>

  </div>

</div>

</div>


<script>

const tg = window.Telegram?.WebApp;

if (tg) {
  tg.ready();
  tg.expand();
}


/* =========================
   ПОРОДЫ
========================= */

const breeds = [

  {name:"Лабрадор", api:"labrador"},
  {name:"Золотистый ретривер", api:"retriever/golden"},
  {name:"Хаски", api:"husky"},
  {name:"Бигль", api:"beagle"},
  {name:"Мопс", api:"pug"},
  {name:"Чихуахуа", api:"chihuahua"},
  {name:"Акита", api:"akita"},
  {name:"Самоед", api:"samoyed"},
  {name:"Далматин", api:"dalmatian"},
  {name:"Боксер", api:"boxer"},
  {name:"Доберман", api:"doberman"},
  {name:"Ротвейлер", api:"rottweiler"},
  {name:"Немецкая овчарка", api:"germanshepherd"},
  {name:"Мальтезе", api:"maltese"},
  {name:"Ши-тцу", api:"shihtzu"},
  {name:"Померанский шпиц", api:"pomeranian"},
  {name:"Чау-чау", api:"chow"},
  {name:"Ньюфаундленд", api:"newfoundland"},
  {name:"Бернский зенненхунд", api:"mountain/bernese"},
  {name:"Английский сеттер", api:"setter/english"},
  {name:"Ирландский сеттер", api:"setter/irish"},
  {name:"Английский спрингер-спаниель", api:"springer/english"},
  {name:"Кокер-спаниель", api:"spaniel/cocker"},
  {name:"Бретонский эпаньоль", api:"brittany"},
  {name:"Бладхаунд", api:"hound/blood"},
  {name:"Бассет-хаунд", api:"hound/basset"},
  {name:"Афганская борзая", api:"hound/afghan"},
  {name:"Грейхаунд", api:"greyhound/italian"},
  {name:"Уиппет", api:"whippet"},
  {name:"Борзая", api:"borzoi"},
  {name:"Эрдельтерьер", api:"airedale"},
  {name:"Скотч-терьер", api:"terrier/scottish"},
  {name:"Вест-хайленд-уайт-терьер", api:"terrier/westhighland"},
  {name:"Йоркширский терьер", api:"terrier/yorkshire"},
  {name:"Керн-терьер", api:"terrier/cairn"},
  {name:"Бордер-терьер", api:"terrier/border"},
  {name:"Стаффордширский терьер", api:"terrier/staffordshire"},
  {name:"Бультерьер", api:"terrier/american"},
  {name:"Французский бульдог", api:"bulldog/french"},
  {name:"Английский бульдог", api:"bulldog/english"},
  {name:"Бостон-терьер", api:"terrier/boston"},
  {name:"Немецкий дог", api:"dane/great"},
  {name:"Сенбернар", api:"stbernard"},
  {name:"Шарпей", api:"sharpei"},
  {name:"Шиба-ину", api:"shiba"},
  {name:"Папильон", api:"papillon"},
  {name:"Пекинес", api:"pekinese"},
  {name:"Пудель", api:"poodle/standard"},
  {name:"Миниатюрный пудель", api:"poodle/miniature"},
  {name:"Той-пудель", api:"poodle/toy"},
  {name:"Колли", api:"collie/border"},
  {name:"Шелти", api:"sheepdog/shetland"},
  {name:"Староанглийская овчарка", api:"sheepdog/english"},
  {name:"Австралийская овчарка", api:"australian/shepherd"},
  {name:"Келпи", api:"kelpie"},
  {name:"Маламут", api:"malamute"},
  {name:"Кеесхонд", api:"keeshond"},
  {name:"Веймаранер", api:"weimaraner"},
  {name:"Визсла", api:"vizsla"},
  {name:"Родезийский риджбек", api:"ridgeback/rhodesian"}

];


/* =========================
   ОБЩЕЕ
========================= */

function openPage(id) {

  document.querySelectorAll(".page")
    .forEach(p => p.classList.remove("active"));

  document.getElementById(id)
    .classList.add("active");

  window.scrollTo(0,0);
}


function goHome() {
  openPage("home");
}


function apiURL(api) {

  const parts = api.split("/");

  if(parts.length === 1) {
    return `https://dog.ceo/api/breed/${parts[0]}/images/random`;
  }

  return `https://dog.ceo/api/breed/${parts[0]}/${parts[1]}/images/random`;
}


async function getDogImage(breed) {

  try {

    const response = await fetch(apiURL(breed.api));

    const data = await response.json();

    return data.message;

  } catch(e) {

    return "";

  }

}


/* =========================
   СОБАКА ДНЯ
========================= */

async function showDogOfDay() {

  openPage("dogday");

  const today = new Date();

  const index =
    (today.getFullYear() * 372 +
     today.getMonth() * 31 +
     today.getDate())
     % breeds.length;

  const breed = breeds[index];

  const months = [
    "января",
    "февраля",
    "марта",
    "апреля",
    "мая",
    "июня",
    "июля",
    "августа",
    "сентября",
    "октября",
    "ноября",
    "декабря"
  ];

  document.getElementById("dayDate").innerText =
    `${today.getDate()} ${months[today.getMonth()]} — собака дня`;

  document.getElementById("dayBreed").innerText =
    breed.name;

  document.getElementById("dayText").innerText =
    `Сегодня DogAtlas выбрал породу «${breed.name}» 🐾`;

  document.getElementById("dayImage").src =
    await getDogImage(breed);

}


/* =========================
   УГАДАЙ ПОРОДУ
========================= */

let currentGuess;
let guessScore = 0;


function startGuess() {

  guessScore = 0;

  document.getElementById("guessScore").innerText =
    "Угадано: 0";

  openPage("guess");

  newGuess();

}


async function newGuess() {

  document.getElementById("guessMessage").innerText = "";

  document.getElementById("nextGuess").style.display = "none";

  const answersBox =
    document.getElementById("guessAnswers");

  answersBox.innerHTML =
    '<div class="loading">Загружаю собаку... 🐾</div>';

  currentGuess =
    breeds[Math.floor(Math.random() * breeds.length)];

  document.getElementById("guessImage").src =
    await getDogImage(currentGuess);


  let options = [currentGuess];

  while(options.length < 4) {

    const randomBreed =
      breeds[Math.floor(Math.random() * breeds.length)];

    if(!options.includes(randomBreed)) {
      options.push(randomBreed);
    }

  }


  options.sort(() => Math.random() - .5);

  answersBox.innerHTML = "";


  options.forEach(breed => {

    const btn = document.createElement("button");

    btn.className = "answer";

    btn.innerText = breed.name;

    btn.onclick = () =>
      checkGuess(breed, btn);

    answersBox.appendChild(btn);

  });

}


function checkGuess(selected, clickedButton) {

  const buttons =
    document.querySelectorAll("#guessAnswers .answer");

  buttons.forEach(b => b.disabled = true);


  if(selected === currentGuess) {

    guessScore++;

    clickedButton.classList.add("correct");

    document.getElementById("guessMessage").innerText =
      "✅ Правильно!";

  } else {

    clickedButton.classList.add("wrong");

    document.getElementById("guessMessage").innerText =
      `❌ Это ${currentGuess.name}`;

    buttons.forEach(btn => {

      if(btn.innerText === currentGuess.name) {
        btn.classList.add("correct");
      }

    });

  }


  document.getElementById("guessScore").innerText =
    `Угадано: ${guessScore}`;

  document.getElementById("nextGuess").style.display =
    "block";

}


/* =========================
   СЛУЧАЙНАЯ СОБАКА
========================= */

function showRandomDog() {

  openPage("random");

  loadRandomDog();

}


async function loadRandomDog() {

  const breed =
    breeds[Math.floor(Math.random() * breeds.length)];

  document.getElementById("randomBreed").innerText =
    breed.name;

  document.getElementById("randomImage").src =
    await getDogImage(breed);

}


/* =========================
   КАТАЛОГ
========================= */

function openCatalog() {

  openPage("catalog");

  renderCatalog();

}


function renderCatalog() {

  const search =
    document.getElementById("breedSearch")
    .value
    .toLowerCase();

  const container =
    document.getElementById("catalogList");

  container.innerHTML = "";


  breeds
    .filter(breed =>
      breed.name.toLowerCase().includes(search)
    )
    .forEach(breed => {

      const card =
        document.createElement("div");

      card.className =
        "breed-card";

      card.innerText =
        breed.name;

      card.onclick =
        () => showBreed(breed);

      container.appendChild(card);

    });

}


async function showBreed(breed) {

  openPage("breedDetail");

  document.getElementById("detailBreed").innerText =
    breed.name;

  document.getElementById("detailImage").src =
    await getDogImage(breed);


  document.getElementById("detailAnother").onclick =
    async () => {

      document.getElementById("detailImage").src =
        await getDogImage(breed);

    };

}


/* =========================
   ТЕСТ
========================= */

const quizQuestions = [

  {
    q: "Как выглядит твой идеальный выходной?",
    answers: [
      ["Гулять с друзьями", "labrador"],
      ["Уехать навстречу приключениям", "husky"],
      ["Лежать дома и отдыхать", "pug"],
      ["Заняться чем-то умным", "collie"]
    ]
  },

  {
    q: "Что для тебя важнее всего?",
    answers: [
      ["Друзья и близкие", "labrador"],
      ["Свобода", "husky"],
      ["Комфорт", "pug"],
      ["Достижения", "collie"]
    ]
  },

  {
    q: "На вечеринке ты скорее...",
    answers: [
      ["Общаюсь со всеми", "labrador"],
      ["Придумаю какую-нибудь авантюру", "husky"],
      ["Сижу с любимыми людьми", "pug"],
      ["Наблюдаю и всё анализирую", "collie"]
    ]
  },

  {
    q: "Если появилась сложная задача, ты...",
    answers: [
      ["Попрошу помощи", "labrador"],
      ["Рискну и попробую", "husky"],
      ["Отложу на потом 😅", "pug"],
      ["Буду решать, пока не получится", "collie"]
    ]
  },

  {
    q: "Что звучит больше всего как ты?",
    answers: [
      ["Добрая и общительная", "labrador"],
      ["Независимая и энергичная", "husky"],
      ["Спокойная и уютная", "pug"],
      ["Умная и внимательная", "collie"]
    ]
  },

  {
    q: "Куда бы ты скорее отправилась?",
    answers: [
      ["На пляж с друзьями", "labrador"],
      ["В горы", "husky"],
      ["В красивый отель", "pug"],
      ["В новый интересный город", "collie"]
    ]
  },

  {
    q: "Как ты принимаешь решения?",
    answers: [
      ["Советуюсь с близкими", "labrador"],
      ["Делаю как чувствую", "husky"],
      ["Выбираю самый комфортный вариант", "pug"],
      ["Всё продумываю", "collie"]
    ]
  }

];


const quizDogs = {

  labrador: {
    name: "Лабрадор 🦮",
    api: "labrador",
    text:
      "Ты открытая, дружелюбная и ценишь своих людей. С тобой редко бывает скучно."
  },

  husky: {
    name: "Хаски 🐺",
    api: "husky",
    text:
      "Ты любишь свободу, приключения и умеешь идти своей дорогой."
  },

  pug: {
    name: "Мопс 🐶",
    api: "pug",
    text:
      "Ты умеешь ценить уют, вкусную еду и спокойные моменты жизни."
  },

  collie: {
    name: "Бордер-колли 🐾",
    api: "collie/border",
    text:
      "Ты любознательная, быстро соображаешь и любишь, когда происходит что-то интересное."
  }

};


let quizStep = 0;

let quizPoints = {};


function startQuiz() {

  quizStep = 0;

  quizPoints = {
    labrador:0,
    husky:0,
    pug:0,
    collie:0
  };

  openPage("quiz");

  showQuizQuestion();

}


function showQuizQuestion() {

  const question =
    quizQuestions[quizStep];

  document.getElementById("quizProgress").innerText =
    `Вопрос ${quizStep + 1} из ${quizQuestions.length}`;

  document.getElementById("quizQuestion").innerText =
    question.q;


  const answers =
    document.getElementById("quizAnswers");

  answers.innerHTML = "";


  question.answers.forEach(answer => {

    const btn =
      document.createElement("button");

    btn.className =
      "answer";

    btn.innerText =
      answer[0];

    btn.onclick =
      () => selectQuizAnswer(answer[1]);

    answers.appendChild(btn);

  });

}


function selectQuizAnswer(type) {

  quizPoints[type]++;

  quizStep++;


  if(quizStep >= quizQuestions.length) {

    finishQuiz();

  } else {

    showQuizQuestion();

  }

}


async function finishQuiz() {

  let winner =
    Object.keys(quizPoints)
    .reduce((a,b) =>
      quizPoints[a] >= quizPoints[b]
      ? a
      : b
    );


  const dog =
    quizDogs[winner];

  openPage("quizResultPage");


  document.getElementById("finalBreed").innerText =
    `Ты — ${dog.name}`;

  document.getElementById("finalText").innerText =
    dog.text;


  document.getElementById("finalImage").src =
    await getDogImage(dog);

}

</script>

</body>
</html>
